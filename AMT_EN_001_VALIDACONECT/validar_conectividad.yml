---
# ==============================================================================
# Playbook: Reporte de Conectividad General AMT (Linux y Windows)
# Proyecto: AMT_EN_001_VALIDACONECT
# Estandarizado con el lineamiento institucional de PlayBooks_Unix (UNX_EN_012_CONECTIVIDAD)
# ==============================================================================

- name: Reporte de Conectividad - Servidores AMT
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: no
  ignore_unreachable: true
  vars:
    # Configuración de Servidor de Correo (Sobrescribible via Extra Vars en AWX)
    email_host: "{{ email_smtp_host | default('172.22.88.6') }}"
    email_port: "{{ email_smtp_port | default(25) }}"
    email_from: "{{ email_remitente | default('amt@telmexla.net.co') }}"
    email_to: "{{ email_destinatarios | default('middletierdatacente@claro.com.co') }}"
    email_cc: "{{ email_copia | default('') }}"
    email_subject: "{{ email_asunto | default('Reporte de Conectividad - Servidores AMT') }}"

    # Archivo CSV de Reporte para Servidores Fallidos
    output_file: "reporte_conectividad_amt.csv"
    headers: "hostname,ip_gestion,tipo_so,msg_conexion"

    # Metadatos del Reporte Institucional
    actividad: "CONECTIVIDAD SERVIDORES AMT"
    titulo_reporte: "Reporte de Conectividad AMT"
    area_nombre: "Área de Automatización y Middleware (AMT)"

    # Timeouts de verificación de conexión (segundos)
    conn_timeout: "{{ connection_timeout | default(20) }}"
    conn_connect_timeout: "{{ connect_timeout | default(10) }}"

    # Recursos gráficos y plantillas institucionales
    signature_b64: "{{ lookup('file', playbook_dir ~ '/../resources/img/FirmaClaro.gif', errors='ignore') | default('', true) | b64encode }}"
    header_template: "{{ playbook_dir }}/../resources/templates/mail/header.html"
    footer_template: "{{ playbook_dir }}/../resources/templates/mail/footer.html"

  tasks:

    # --------------------------------------------------------------------------
    # 1. PREPARACIÓN Y LIMPIEZA INICIAL DEL REPORTE
    # --------------------------------------------------------------------------
    - name: Inicializar archivo CSV de salida
      become: false
      copy:
        content: "{{ headers }}\n"
        dest: "{{ output_file }}"
        force: true
      delegate_to: localhost
      run_once: true

    - name: Capturar fecha y hora de ejecucion en localhost
      setup:
        filter:
          - 'ansible_date_time'
      delegate_to: localhost
      run_once: true

    # --------------------------------------------------------------------------
    # 2. IDENTIFICACIÓN DE PLATAFORMA Y VALIDACIÓN DE CONECTIVIDAD
    # --------------------------------------------------------------------------
    - name: Determinar tipo de sistema operativo
      set_fact:
        tipo_so: "{{ 'Windows' if (ansible_connection | default('') == 'winrm' or 'windows_servers' in group_names) else 'Linux' }}"

    - block:
        # Validación para Servidores Linux (SSH)
        - name: Validar conectividad SSH (Linux)
          when: tipo_so == 'Linux'
          wait_for_connection:
            timeout: "{{ conn_timeout }}"
            connect_timeout: "{{ conn_connect_timeout }}"
          vars:
            ansible_connection: ssh
            ansible_user: "{{ linux_user_override | default(omit) }}"
            ansible_password: "{{ linux_pass_override | default(omit) }}"
            ansible_ssh_pass: "{{ linux_pass_override | default(omit) }}"
            ansible_ssh_common_args: >-
              -o StrictHostKeyChecking=no
              -o UserKnownHostsFile=/dev/null
              -o ConnectTimeout={{ conn_connect_timeout }}
          timeout: 45
          register: conn_linux_result

        # Validación para Servidores Windows (WinRM)
        - name: Validar conectividad WinRM (Windows)
          when: tipo_so == 'Windows'
          wait_for_connection:
            timeout: "{{ conn_timeout }}"
            connect_timeout: "{{ conn_connect_timeout }}"
          vars:
            ansible_connection: winrm
            ansible_winrm_server_cert_validation: ignore
            ansible_winrm_transport: "{{ winrm_transport | default('ntlm') }}"
          timeout: 45
          register: conn_win_result

        - name: Registrar host como conectado exitosamente
          set_fact:
            host_conectado: true
            host_error_msg: "OK"

      rescue:
        - name: Capturar detalle del error de conexion
          set_fact:
            host_conectado: false
            host_error_msg: >-
              {{
                (conn_linux_result.msg | default(conn_win_result.msg | default(ansible_failed_result.msg | default('Timeout de conexion o host inalcanzable'))))
                | regex_replace('[\r\n]+', '  ')
                | regex_replace(',', '  ')
                | regex_replace('-', '  ')
                | regex_replace('@', '  ')
                | trim
              }}

        - name: Guardar servidor fallido en archivo CSV
          become: false
          lineinfile:
            path: "{{ output_file }}"
            line: "{{ inventory_hostname }},{{ ansible_host | default(inventory_hostname) }},{{ tipo_so }},{{ host_error_msg }}"
            state: present
          delegate_to: localhost

    # --------------------------------------------------------------------------
    # 3. CONSOLIDACIÓN DE RESULTADOS Y CÁLCULO DE MÉTRICAS
    # --------------------------------------------------------------------------
    - name: Consolidar metricas globales de conectividad
      set_fact:
        total_hosts: "{{ ansible_play_hosts_all | length | int }}"
        total_exitosos: "{{ (ansible_play_hosts_all | map('extract', hostvars, 'host_conectado') | select('defined') | select('equalto', true) | list | length) | int }}"
        total_fallidos: "{{ (ansible_play_hosts_all | map('extract', hostvars, 'host_conectado') | select('defined') | select('equalto', false) | list | length) | int }}"
        total_linux: "{{ (ansible_play_hosts_all | select('in', (groups['linux_servers'] | default([]))) | list | length) | int }}"
        total_linux_ok: "{{ (ansible_play_hosts_all | select('in', (groups['linux_servers'] | default([]))) | map('extract', hostvars, 'host_conectado') | select('defined') | select('equalto', true) | list | length) | int }}"
        total_win: "{{ (ansible_play_hosts_all | select('in', (groups['windows_servers'] | default([]))) | list | length) | int }}"
        total_win_ok: "{{ (ansible_play_hosts_all | select('in', (groups['windows_servers'] | default([]))) | map('extract', hostvars, 'host_conectado') | select('defined') | select('equalto', true) | list | length) | int }}"
      run_once: true

    - name: Adaptar variables estandar y calcular porcentajes
      set_fact:
        fallidos:
          stdout: "{{ total_fallidos }}"
        total_linux_fail: "{{ (total_linux | int) - (total_linux_ok | int) }}"
        total_win_fail: "{{ (total_win | int) - (total_win_ok | int) }}"
        porcentaje_conectados: "{{ ((total_exitosos | float * 100.0) / (total_hosts | float)) | round(1) if (total_hosts | int > 0) else 0.0 }}"
        porcentaje_fallidos: "{{ ((total_fallidos | float * 100.0) / (total_hosts | float)) | round(1) if (total_hosts | int > 0) else 0.0 }}"
        pct_linux_ok: "{{ ((total_linux_ok | float * 100.0) / (total_linux | float)) | round(1) if (total_linux | int > 0) else 0.0 }}"
        pct_win_ok: "{{ ((total_win_ok | float * 100.0) / (total_win | float)) | round(1) if (total_win | int > 0) else 0.0 }}"
      run_once: true

    - name: Mostrar resumen del diagnostico en logs
      debug:
        msg:
          - "================ RESUMEN DE CONECTIVIDAD AMT ================"
          - "Total Servidores Evaluados : {{ total_hosts }}"
          - "Conectados Exitosamente    : {{ total_exitosos }} ({{ porcentaje_conectados }}%)"
          - "Sin Conectividad (Fallidos): {{ total_fallidos }} ({{ porcentaje_fallidos }}%)"
          - "Linux   - OK: {{ total_linux_ok }} / Fallidos: {{ total_linux_fail }} (Total: {{ total_linux }})"
          - "Windows - OK: {{ total_win_ok }} / Fallidos: {{ total_win_fail }} (Total: {{ total_win }})"
          - "Archivo CSV generado       : {{ output_file }}"
          - "=============================================================="
      run_once: true

    # --------------------------------------------------------------------------
    # 4. ENVÍO DE REPORTE POR CORREO ELECTRÓNICO CON CSV ADJUNTO
    # --------------------------------------------------------------------------
    - name: Enviar correo con reporte y adjunto CSV
      become: false
      community.general.mail:
        host: "{{ email_host }}"
        port: "{{ email_port }}"
        subject: "{{ email_subject }}"
        subtype: html
        body: "{{ lookup('template', 'email_template.j2') }}"
        from: "{{ email_from }}"
        to: "{{ email_to }}"
        cc: "{{ email_cc if (email_cc is defined and email_cc | length > 0) else omit }}"
        attach:
          - "{{ output_file }}"
      delegate_to: localhost
      run_once: true
      vars:
        total_hosts: "{{ total_hosts }}"
        total_exitosos: "{{ total_exitosos }}"
        total_fallidos: "{{ total_fallidos }}"
        porcentaje_conectados: "{{ porcentaje_conectados }}"
        porcentaje_fallidos: "{{ porcentaje_fallidos }}"
        total_linux: "{{ total_linux }}"
        total_linux_ok: "{{ total_linux_ok }}"
        total_linux_fail: "{{ total_linux_fail }}"
        pct_linux_ok: "{{ pct_linux_ok }}"
        total_win: "{{ total_win }}"
        total_win_ok: "{{ total_win_ok }}"
        total_win_fail: "{{ total_win_fail }}"
        pct_win_ok: "{{ pct_win_ok }}"
      when:
        - email_to is defined
        - email_to | length > 0
        - enviar_correo | default(true) | bool
      ignore_errors: true
      register: envio_correo_result

    - name: Notificar estado del envio de correo
      debug:
        msg: >-
          {{
            'Correo enviado exitosamente a ' ~ email_to
            if (envio_correo_result is defined and envio_correo_result is not failed)
            else 'Aviso: No se pudo enviar el correo o envio_correo esta desactivado (' ~ (envio_correo_result.msg | default('Sin detalles')) ~ ')'
          }}
      delegate_to: localhost
      run_once: true
