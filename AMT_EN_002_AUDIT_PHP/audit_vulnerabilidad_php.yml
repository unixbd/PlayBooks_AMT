---
# ==============================================================================
# Playbook: Auditoría de Vulnerabilidad PHP (CERT-EU 2026-018)
# CVEs: CVE-2026-109618 (OOM RCE) y CVE-2026-109619 (Stale Global State RCE)
# Proyecto: AMT_EN_002_AUDIT_PHP
# Estandarizado con el lineamiento institucional de PlayBooks_AMT
# Soporte Híbrido: Linux (SSH), Windows (WinRM / PS 2.0 Fallback) y Contenedores (Docker / Podman)
# ==============================================================================

- name: Auditoría de Vulnerabilidad Crítica PHP - Servidores AMT
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: no
  ignore_unreachable: true
  vars:
    # --------------------------------------------------------------------------
    # Configuración de Servidor de Correo (Sobrescribible via Extra Vars en AWX)
    # --------------------------------------------------------------------------
    email_host: "{{ email_smtp_host | default('172.22.88.6') }}"
    email_port: "{{ email_smtp_port | default(25) }}"
    email_from: "{{ email_remitente | default('amt@telmexla.net.co') }}"
    email_to: "{{ email_destinatarios | default('middletierdatacente@claro.com.co') }}"
    email_cc: "{{ email_copia | default('') }}"
    email_subject: "{{ email_asunto | default('Reporte de Auditoría - Vulnerabilidad Crítica PHP (CERT-EU 2026-018)') }}"

    # --------------------------------------------------------------------------
    # Metadatos del Reporte Institucional
    # --------------------------------------------------------------------------
    actividad: "AUDITORÍA DE VULNERABILIDAD PHP (CERT-EU 2026-018)"
    titulo_reporte: "Reporte de Seguridad PHP"
    subtitulo_reporte: "Auditoría de Versiones y Exposición a CVE-2026-109618 / CVE-2026-109619 (Host y Contenedores)"
    area_nombre: "Área de Automatización y Middleware (AMT)"

    # Timeouts de conexión (segundos)
    conn_timeout: "{{ connection_timeout | default(20) }}"
    conn_connect_timeout: "{{ connect_timeout | default(10) }}"

    # Transporte WinRM limpio (sin bucles de recursión)
    winrm_transport_clean: "{{ (winrm_transport | default('ntlm')) | regex_replace('\\s*#.*$', '') | trim }}"

    # Recursos gráficos y plantillas institucionales
    signature_b64: "{{ lookup('file', playbook_dir ~ '/../resources/img/FirmaClaro.gif', errors='ignore') | default('', true) | b64encode }}"
    header_template: "{{ playbook_dir }}/../resources/templates/mail/header.html"
    footer_template: "{{ playbook_dir }}/../resources/templates/mail/footer.html"

  tasks:

    # --------------------------------------------------------------------------
    # 1. PREPARACIÓN INICIAL EN CONTROLADOR (LOCALHOST)
    # --------------------------------------------------------------------------
    - name: Capturar fecha y hora de ejecucion en localhost
      ansible.builtin.setup:
        filter:
          - 'ansible_date_time'
      delegate_to: localhost
      run_once: true

    # --------------------------------------------------------------------------
    # 2. IDENTIFICACIÓN DE PLATAFORMA Y VALIDACIÓN DE CONECTIVIDAD
    # --------------------------------------------------------------------------
    - name: Determinar tipo de sistema operativo
      ansible.builtin.set_fact:
        tipo_so: "{{ 'Windows' if (ansible_connection | default('') == 'winrm' or 'windows_servers' in group_names) else 'Linux' }}"

    - name: Inicializar estado base de conectividad y diagnostico
      ansible.builtin.set_fact:
        host_conectado: false
        host_error_msg: "Sin conexion o credenciales no verificadas"
        host_so_desc: "{{ tipo_so }} (Sin Conexión)"
        php_instalado: false
        php_version: "N/D"
        php_ruta: "N/D"
        tiene_contenedores_php: false
        contenedores_php_desc: "N/D"
        estado_vulnerabilidad: "SIN_CONEXION"
        detalle_dictamen: "Fallo de conectividad o credenciales rechazadas al evaluar el servidor"

    # Validación SSH (Linux)
    - name: Probar conectividad SSH (Linux)
      when: tipo_so == 'Linux'
      ansible.builtin.ping:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ linux_user_override | default(omit) }}"
        ansible_password: "{{ linux_pass_override | default(omit) }}"
        ansible_ssh_pass: "{{ linux_pass_override | default(omit) }}"
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o ConnectTimeout={{ conn_connect_timeout }}
      timeout: 35
      register: conn_linux_result
      ignore_errors: true
      ignore_unreachable: true

    # Validación WinRM (Windows)
    - name: Probar conectividad WinRM nativa (Windows)
      when: tipo_so == 'Windows'
      ansible.windows.win_ping:
      vars:
        ansible_connection: winrm
        ansible_port: "{{ winrm_port | default(5985) }}"
        ansible_winrm_scheme: "{{ winrm_scheme | default('http') }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_transport: "{{ winrm_transport_clean }}"
        ansible_shell_type: powershell
      timeout: 35
      register: conn_win_result
      ignore_errors: true
      ignore_unreachable: true

    - name: Fallback con comando raw para PowerShell 2.0 (Windows)
      when:
        - tipo_so == 'Windows'
        - (conn_win_result is failed or conn_win_result is unreachable or (conn_win_result.ping is not defined))
      ansible.builtin.raw: "cmd.exe /c echo pong"
      vars:
        ansible_connection: winrm
        ansible_port: "{{ winrm_port | default(5985) }}"
        ansible_winrm_scheme: "{{ winrm_scheme | default('http') }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_transport: "{{ winrm_transport_clean }}"
      timeout: 35
      register: conn_win_raw_result
      ignore_errors: true
      ignore_unreachable: true

    - name: Evaluar y registrar estado real de conectividad
      ansible.builtin.set_fact:
        host_conectado: >-
          {{
            (
              conn_linux_result is defined and
              (conn_linux_result is not failed) and
              (conn_linux_result is not unreachable) and
              ((conn_linux_result.ping | default('')) == 'pong')
            )
            if tipo_so == 'Linux'
            else (
              (
                conn_win_result is defined and
                (conn_win_result is not failed) and
                (conn_win_result is not unreachable) and
                ((conn_win_result.ping | default('')) == 'pong')
              ) or (
                conn_win_raw_result is defined and
                (conn_win_raw_result is not failed) and
                (conn_win_raw_result is not unreachable) and
                ('pong' in (conn_win_raw_result.stdout | default('')))
              )
            )
          }}

    - name: Registrar diagnostico para servidores sin conexion o credenciales rechazadas
      when: not (host_conectado | bool)
      ansible.builtin.set_fact:
        host_error_msg: >-
          {{
            (conn_linux_result.msg | default(conn_linux_result.module_stderr | default('Fallo de conexión SSH / Timeout')))
            if tipo_so == 'Linux'
            else (
              conn_win_result.msg
              | default(conn_win_result.module_stderr
              | default(conn_win_raw_result.msg
              | default(conn_win_raw_result.module_stderr
              | default('Credenciales rechazadas (NTLM) o puerto WinRM inaccesible'))))
            )
          }}
        detalle_dictamen: >-
          {{
            'Error de autenticación WinRM: credenciales rechazadas por el servidor (NTLM)'
            if (
              ('credentials were rejected' in ((conn_win_result.msg | default('')) ~ (conn_win_raw_result.msg | default('')))) or
              ('rejected by the server' in ((conn_win_result.msg | default('')) ~ (conn_win_raw_result.msg | default(''))))
            )
            else (
              'Error de conectividad SSH / Linux: ' ~ (conn_linux_result.msg | default('Host inalcanzable'))
              if tipo_so == 'Linux'
              else 'Error de conectividad WinRM: ' ~ (conn_win_result.msg | default(conn_win_raw_result.msg | default('Host inalcanzable o puerto 5985 cerrado')))
            )
          }}
        estado_vulnerabilidad: "SIN_CONEXION"
        host_so_desc: "{{ tipo_so }} (Sin Conexión)"

    - name: Registrar servidor como conectado exitosamente
      when: host_conectado | bool
      ansible.builtin.set_fact:
        host_error_msg: "OK"

    # --------------------------------------------------------------------------
    # 3. AUDITORÍA EN SERVIDORES CONECTADOS (LINUX)
    # --------------------------------------------------------------------------
    - name: Auditoria en servidores Linux conectados
      when:
        - tipo_so == 'Linux'
        - host_conectado | bool
      block:
        - name: Ejecutar inspeccion completa en Linux (SO, PHP y Contenedores)
          ansible.builtin.shell: |
            {% raw %}
            # 1. Sistema Operativo
            OS_DESC="Linux"
            if [ -f /etc/os-release ]; then
              OS_DESC=$(. /etc/os-release && echo "$PRETTY_NAME")
            elif [ -f /etc/redhat-release ]; then
              OS_DESC=$(cat /etc/redhat-release)
            elif [ -f /etc/system-release ]; then
              OS_DESC=$(cat /etc/system-release)
            else
              OS_DESC=$(uname -s -r)
            fi

            # 2. PHP en Host
            PHP_BIN=$(command -v php 2>/dev/null || which php 2>/dev/null || true)
            if [ -z "$PHP_BIN" ]; then
              for p in /usr/bin/php /etc/alternatives/php /usr/bin/php[5-9]* /usr/local/bin/php /opt/rh/rh-php*/root/usr/bin/php /opt/lampp/bin/php /usr/sbin/php-fpm*; do
                if [ -x "$p" ]; then
                  PHP_BIN="$p"
                  break
                fi
              done
            fi

            PHP_INFO="NO_INSTALADO||"
            if [ -n "$PHP_BIN" ] && [ -x "$PHP_BIN" ]; then
              PHP_OUT=$("$PHP_BIN" -v 2>&1 | head -n 1)
              PHP_INFO="SI_INSTALADO|${PHP_BIN}|${PHP_OUT}"
            fi

            # 3. PHP en Contenedores (Docker / Podman seguro con timeout)
            CONT_INFO=""
            if command -v docker >/dev/null 2>&1; then
              D_IDS=$(timeout 5 docker ps -q 2>/dev/null || true)
              for cid in $D_IDS; do
                cphp=$(timeout 5 docker exec "$cid" php -v 2>/dev/null | head -n 1 || true)
                if [ -n "$cphp" ]; then
                  cname=$(docker inspect -f '{{.Name}}' "$cid" 2>/dev/null | sed 's/^\///' || echo "$cid")
                  cimg=$(docker inspect -f '{{.Config.Image}}' "$cid" 2>/dev/null || echo "img")
                  CONT_INFO="${CONT_INFO}[Docker:${cname} (${cimg}) -> ${cphp}]; "
                fi
              done
            fi

            if command -v podman >/dev/null 2>&1; then
              P_IDS=$(timeout 5 podman ps -q 2>/dev/null || true)
              for cid in $P_IDS; do
                cphp=$(timeout 5 podman exec "$cid" php -v 2>/dev/null | head -n 1 || true)
                if [ -n "$cphp" ]; then
                  cname=$(podman inspect -f '{{.Name}}' "$cid" 2>/dev/null | sed 's/^\///' || echo "$cid")
                  cimg=$(podman inspect -f '{{.Config.Image}}' "$cid" 2>/dev/null || echo "img")
                  CONT_INFO="${CONT_INFO}[Podman:${cname} (${cimg}) -> ${cphp}]; "
                fi
              done
            fi

            echo "SO:${OS_DESC}|PHP:${PHP_INFO}|CONT:${CONT_INFO:-NINGUNO}"
            {% endraw %}
          vars:
            ansible_connection: ssh
            ansible_user: "{{ linux_user_override | default(omit) }}"
            ansible_password: "{{ linux_pass_override | default(omit) }}"
            ansible_ssh_pass: "{{ linux_pass_override | default(omit) }}"
            ansible_ssh_common_args: >-
              -o StrictHostKeyChecking=no
              -o UserKnownHostsFile=/dev/null
              -o ConnectTimeout={{ conn_connect_timeout }}
          register: linux_audit_raw
          changed_when: false
          ignore_errors: true
          ignore_unreachable: true
          timeout: 45

        - name: Validar si la inspeccion en Linux fue exitosa
          ansible.builtin.set_fact:
            linux_audit_ok: "{{ linux_audit_raw is defined and (linux_audit_raw is not failed) and (linux_audit_raw is not unreachable) and (linux_audit_raw.stdout_lines is defined) and (linux_audit_raw.stdout_lines | length > 0) and ('SO:' in linux_audit_raw.stdout_lines[0]) }}"

        - name: Procesar variables capturadas de Linux
          when: linux_audit_ok | bool
          ansible.builtin.set_fact:
            host_so_desc: "{{ linux_audit_raw.stdout_lines[0].split('|')[0] | regex_replace('^SO:', '') | trim }}"
            php_status_line: "{{ linux_audit_raw.stdout_lines[0].split('|')[1:4] | join('|') | regex_replace('^PHP:', '') | trim }}"
            containers_php_raw: "{{ linux_audit_raw.stdout_lines[0].split('|')[4:] | join('|') | regex_replace('^CONT:', '') | trim }}"

        - name: Marcar servidor Linux como inalcanzable si fallo la auditoria
          when: not (linux_audit_ok | bool)
          ansible.builtin.set_fact:
            host_conectado: false
            estado_vulnerabilidad: "SIN_CONEXION"
            host_so_desc: "Linux (Sin Conexión)"
            php_instalado: false
            php_version: "N/D"
            php_ruta: "N/D"
            tiene_contenedores_php: false
            contenedores_php_desc: "N/D"
            detalle_dictamen: "{{ 'Error de conectividad SSH durante auditoría: ' ~ (linux_audit_raw.msg | default('Timeout o sesión terminada')) }}"

    # --------------------------------------------------------------------------
    # 4. AUDITORÍA EN SERVIDORES CONECTADOS (WINDOWS)
    # --------------------------------------------------------------------------
    - name: Auditoria en servidores Windows conectados
      when:
        - tipo_so == 'Windows'
        - host_conectado | bool
      block:
        - name: Auditoria en Windows con PowerShell
          ansible.windows.win_shell: |
            {% raw %}
            $ErrorActionPreference = 'SilentlyContinue'

            # 1. SO
            $osInfo = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
            if (-not $osInfo) {
              $osInfo = Get-WmiObject Win32_OperatingSystem -ErrorAction SilentlyContinue
            }
            $osName = if ($osInfo) { "$($osInfo.Caption) ($($osInfo.Version))" } else { "Windows Server" }

            # 2. PHP en Host
            $phpCmd = Get-Command php.exe -ErrorAction SilentlyContinue
            $phpPath = $null
            if ($phpCmd) {
              $phpPath = $phpCmd.Source
            } else {
              $commonPaths = @(
                "C:\php\php.exe",
                "C:\xampp\php\php.exe",
                "C:\tools\php\php.exe",
                "C:\Program Files\PHP\php.exe",
                "C:\Program Files (x86)\PHP\php.exe"
              )
              foreach ($p in $commonPaths) {
                if (Test-Path $p) {
                  $phpPath = $p
                  break
                }
              }
            }

            $phpLine = if ($phpPath) {
              $v = (& $phpPath -v | Select-Object -First 1)
              "SI_INSTALADO|$phpPath|$v"
            } else {
              "NO_INSTALADO||"
            }

            # 3. Contenedores Windows (Docker)
            $cAudit = ""
            if (Get-Command docker.exe -ErrorAction SilentlyContinue) {
              $cids = docker ps -q 2>$null
              if ($cids) {
                foreach ($cid in $cids) {
                  $cphp = (docker exec $cid php -v 2>$null | Select-Object -First 1)
                  if ($cphp) {
                    $cname = (docker inspect -f "{{.Name}}" $cid 2>$null).TrimStart('/')
                    $cimg = docker inspect -f "{{.Config.Image}}" $cid 2>$null
                    $cAudit += "[Docker:$cname ($cimg) -> $cphp]; "
                  }
                }
              }
            }
            if (-not $cAudit) { $cAudit = "NINGUNO" }

            Write-Output "SO:$osName|PHP:$phpLine|CONT:$cAudit"
            {% endraw %}
          vars:
            ansible_connection: winrm
            ansible_port: "{{ winrm_port | default(5985) }}"
            ansible_winrm_scheme: "{{ winrm_scheme | default('http') }}"
            ansible_winrm_server_cert_validation: ignore
            ansible_winrm_transport: "{{ winrm_transport_clean }}"
            ansible_shell_type: powershell
          register: win_audit_raw
          changed_when: false
          ignore_errors: true
          ignore_unreachable: true
          timeout: 45

        - name: Fallback CMD nativo para PowerShell 2.0 (Windows)
          when: (win_audit_raw is failed) or (win_audit_raw is unreachable) or (win_audit_raw.stdout_lines is not defined) or (win_audit_raw.stdout_lines | length == 0) or ('SO:' not in (win_audit_raw.stdout_lines[0] | default('')))
          ansible.builtin.raw: 'cmd.exe /c ver & where php.exe 2>nul || (for %i in (C:\php\php.exe C:\tools\php\php.exe C:\xampp\php\php.exe "C:\Program Files\PHP\php.exe") do @if exist "%~i" echo %~i)'
          vars:
            ansible_connection: winrm
            ansible_port: "{{ winrm_port | default(5985) }}"
            ansible_winrm_scheme: "{{ winrm_scheme | default('http') }}"
            ansible_winrm_server_cert_validation: ignore
            ansible_winrm_transport: "{{ winrm_transport_clean }}"
          register: win_raw_fallback
          ignore_errors: true
          ignore_unreachable: true
          timeout: 35

        - name: Evaluar si alguna auditoria en Windows fue exitosa
          ansible.builtin.set_fact:
            win_shell_ok: "{{ win_audit_raw is defined and (win_audit_raw is not failed) and (win_audit_raw is not unreachable) and (win_audit_raw.stdout_lines is defined) and (win_audit_raw.stdout_lines | length > 0) and ('SO:' in win_audit_raw.stdout_lines[0]) }}"
            win_raw_ok: "{{ win_raw_fallback is defined and (win_raw_fallback is not failed) and (win_raw_fallback is not unreachable) and (win_raw_fallback.stdout_lines is defined) and (win_raw_fallback.stdout_lines | length > 0) }}"

        - name: Procesar variables desde win_shell
          when: win_shell_ok | bool
          ansible.builtin.set_fact:
            host_so_desc: "{{ win_audit_raw.stdout_lines[0].split('|')[0] | regex_replace('^SO:', '') | trim }}"
            php_status_line: "{{ win_audit_raw.stdout_lines[0].split('|')[1:4] | join('|') | regex_replace('^PHP:', '') | trim }}"
            containers_php_raw: "{{ win_audit_raw.stdout_lines[0].split('|')[4:] | join('|') | regex_replace('^CONT:', '') | trim }}"

        - name: Procesar variables desde fallback CMD
          when:
            - not (win_shell_ok | bool)
            - win_raw_ok | bool
          ansible.builtin.set_fact:
            host_so_desc: "{{ (win_raw_fallback.stdout_lines | select('search', 'Microsoft Windows') | list | first) | default('Windows Server (Legacy PS 2.0)') }}"
            php_status_line: "{{ 'SI_INSTALADO|' ~ (win_raw_fallback.stdout_lines | select('search', 'php.exe') | list | first) ~ '|PHP' if (win_raw_fallback.stdout_lines is defined and win_raw_fallback.stdout_lines | select('search', 'php.exe') | list | length > 0) else 'NO_INSTALADO||' }}"
            containers_php_raw: "NINGUNO"

        - name: Marcar servidor Windows como inalcanzable si fallaron todos los metodos
          when:
            - not (win_shell_ok | bool)
            - not (win_raw_ok | bool)
          ansible.builtin.set_fact:
            host_conectado: false
            estado_vulnerabilidad: "SIN_CONEXION"
            host_so_desc: "Windows (Sin Conexión)"
            php_instalado: false
            php_version: "N/D"
            php_ruta: "N/D"
            tiene_contenedores_php: false
            contenedores_php_desc: "N/D"
            detalle_dictamen: >-
              {{
                'Error de autenticación WinRM: credenciales rechazadas por el servidor (NTLM)'
                if (
                  ('credentials were rejected' in ((win_audit_raw.msg | default('')) ~ (win_raw_fallback.msg | default('')))) or
                  ('rejected by the server' in ((win_audit_raw.msg | default('')) ~ (win_raw_fallback.msg | default(''))))
                )
                else (
                  'Error de conectividad WinRM: ' ~ (win_audit_raw.msg | default(win_raw_fallback.msg | default('Inalcanzable o puerto cerrado')))
                )
              }}

    # --------------------------------------------------------------------------
    # 5. EVALUACIÓN DE VULNERABILIDAD SEGÚN CERT-EU 2026-018
    # --------------------------------------------------------------------------
    - name: Procesar version de PHP en Host
      when: host_conectado | bool
      ansible.builtin.set_fact:
        php_instalado: "{{ (php_status_line | default('')).split('|')[0] == 'SI_INSTALADO' }}"
        php_ruta: "{{ (php_status_line.split('|')[1] | default('N/A')) if (php_status_line | default('')).split('|')[0] == 'SI_INSTALADO' else 'N/A' }}"
        php_version_raw: "{{ (php_status_line.split('|')[2] | default('')) if (php_status_line | default('')).split('|')[0] == 'SI_INSTALADO' else '' }}"

    - name: Extraer numero de version semantica de PHP en Host
      when: host_conectado | bool
      ansible.builtin.set_fact:
        php_version: >-
          {{
            'No instalado' if (not php_instalado)
            else (
              (php_version_raw | regex_replace('^.*?PHP\s+([0-9]+(?:\.[0-9]+)+).*$', '\1'))
              if ('PHP' in (php_version_raw | default('')) and (php_version_raw | regex_search('[0-9]')))
              else 'Desconocida'
            )
          }}

    - name: Evaluar PHP en Contenedores si existen
      when: host_conectado | bool
      ansible.builtin.set_fact:
        tiene_contenedores_php: "{{ containers_php_raw is defined and containers_php_raw != 'NINGUNO' and containers_php_raw | length > 0 }}"
        contenedores_php_desc: "{{ containers_php_raw if (containers_php_raw is defined and containers_php_raw != 'NINGUNO' and containers_php_raw | length > 0) else 'Sin contenedores con PHP' }}"

    - name: Determinar si algun contenedor ejecuta PHP vulnerable
      when: host_conectado | bool
      ansible.builtin.set_fact:
        contenedor_php_vuln: >-
          {{
            true if (
              tiene_contenedores_php and (
                'PHP 5.' in containers_php_raw or
                'PHP 7.' in containers_php_raw or
                'PHP 8.0.' in containers_php_raw or
                'PHP 8.1.' in containers_php_raw or
                'PHP 8.2.' in containers_php_raw or
                'PHP 8.3.' in containers_php_raw or
                'PHP 8.4.' in containers_php_raw
              )
            ) else false
          }}

    - name: Clasificar estado del Host segun umbrales CERT-EU 2026-018
      when: host_conectado | bool
      ansible.builtin.set_fact:
        host_es_vulnerable: >-
          {{
            false if (not php_instalado)
            else (
              false if (
                php_version != 'Desconocida' and (
                  (php_version is version('8.5.12', '>=')) or
                  (php_version is version('8.4.27', '>=') and php_version is version('8.5.0', '<')) or
                  (php_version is version('8.3.36', '>=') and php_version is version('8.4.0', '<')) or
                  (php_version is version('8.2.35', '>=') and php_version is version('8.3.0', '<'))
                )
              )
              else (
                false if php_version == 'Desconocida' else true
              )
            )
          }}
        host_version_desconocida: "{{ php_instalado and php_version == 'Desconocida' }}"

    - name: Consolidar estado final del servidor
      when: host_conectado | bool
      ansible.builtin.set_fact:
        estado_vulnerabilidad: >-
          {{
            'VULNERABLE' if (host_es_vulnerable or contenedor_php_vuln)
            else (
              'REVISION_MANUAL' if host_version_desconocida
              else (
                'NO_VULNERABLE' if (php_instalado or tiene_contenedores_php)
                else 'NO_APLICA'
              )
            )
          }}
        detalle_dictamen: >-
          {{
            (
              'CRÍTICO: Vulnerable en Host (' ~ php_version ~ ') y Contenedores (' ~ contenedores_php_desc ~ ')'
              if (host_es_vulnerable and contenedor_php_vuln)
              else (
                'CRÍTICO: Contenedor vulnerable detectado: ' ~ contenedores_php_desc
                if contenedor_php_vuln
                else (
                  'CRÍTICO: Versión vulnerable en Host (PHP ' ~ php_version ~ ') - CVE-2026-109618/19'
                  if host_es_vulnerable
                  else (
                    'ADVERTENCIA: PHP instalado (' ~ php_ruta ~ ') con versión no identificada. Requiere revisión manual.'
                    if host_version_desconocida
                    else (
                      'Versión segura con parche aplicado (Host: PHP ' ~ php_version ~ (', Contenedores: ' ~ contenedores_php_desc if tiene_contenedores_php else '') ~ ')'
                      if (php_instalado or tiene_contenedores_php)
                      else 'PHP no se encuentra instalado en el servidor ni en contenedores (Sin riesgo)'
                    )
                  )
                )
              )
            )
          }}

    # --------------------------------------------------------------------------
    # 6. CONSOLIDACIÓN DE RESULTADOS GLOBALES Y MÉTRICAS
    # --------------------------------------------------------------------------
    - name: Consolidar metricas globales de la auditoria
      ansible.builtin.set_fact:
        total_evaluados: "{{ ansible_play_hosts_all | length | int }}"
        total_vulnerables: "{{ (ansible_play_hosts_all | map('extract', hostvars, 'estado_vulnerabilidad') | select('defined') | select('equalto', 'VULNERABLE') | list | length) | int }}"
        total_no_vulnerables: "{{ (ansible_play_hosts_all | map('extract', hostvars, 'estado_vulnerabilidad') | select('defined') | select('equalto', 'NO_VULNERABLE') | list | length) | int }}"
        total_no_aplica: "{{ (ansible_play_hosts_all | map('extract', hostvars, 'estado_vulnerabilidad') | select('defined') | select('equalto', 'NO_APLICA') | list | length) | int }}"
        total_sin_conexion: "{{ (ansible_play_hosts_all | map('extract', hostvars, 'estado_vulnerabilidad') | select('defined') | select('equalto', 'SIN_CONEXION') | list | length) | int }}"
        total_con_php: "{{ (ansible_play_hosts_all | map('extract', hostvars, 'php_instalado') | select('defined') | select('equalto', true) | list | length) | int }}"
        total_con_contenedores_php: "{{ (ansible_play_hosts_all | map('extract', hostvars, 'tiene_contenedores_php') | select('defined') | select('equalto', true) | list | length) | int }}"
      run_once: true

    - name: Mostrar resumen de la auditoria en logs
      ansible.builtin.debug:
        msg:
          - "================ RESUMEN AUDITORIA PHP (CERT-EU 2026-018) ================"
          - "Total Servidores Evaluados      : {{ total_evaluados }}"
          - "Servidores con PHP en Host      : {{ total_con_php }}"
          - "Servidores con PHP Contenedores : {{ total_con_contenedores_php }}"
          - "Servidores VULNERABLES          : {{ total_vulnerables }}"
          - "Servidores No Vulnerables       : {{ total_no_vulnerables }}"
          - "Servidores Sin PHP (No Aplica)  : {{ total_no_aplica }}"
          - "Servidores Sin Conexión         : {{ total_sin_conexion }}"
          - "=========================================================================="
      run_once: true

    # --------------------------------------------------------------------------
    # 7. ENVÍO DE REPORTE POR CORREO ELECTRÓNICO (SOLO TABLA EN CUERPO HTML)
    # --------------------------------------------------------------------------
    - name: Enviar correo institucional con tabla de auditoria
      become: false
      community.general.mail:
        host: "{{ email_host }}"
        port: "{{ email_port }}"
        subject: "{{ email_subject }}"
        subtype: html
        body: "{{ lookup('ansible.builtin.template', 'email_template.j2') }}"
        from: "{{ email_from }}"
        to: "{{ email_to }}"
        cc: "{{ email_cc if (email_cc is defined and email_cc | length > 0) else omit }}"
      delegate_to: localhost
      run_once: true
      vars:
        total_evaluados: "{{ total_evaluados }}"
        total_vulnerables: "{{ total_vulnerables }}"
        total_no_vulnerables: "{{ total_no_vulnerables }}"
        total_no_aplica: "{{ total_no_aplica }}"
        total_sin_conexion: "{{ total_sin_conexion }}"
        total_con_php: "{{ total_con_php }}"
        total_con_contenedores_php: "{{ total_con_contenedores_php }}"
      when:
        - email_to is defined
        - email_to | length > 0
        - enviar_correo | default(true) | bool
      ignore_errors: true
      register: envio_correo_result

    - name: Notificar estado del envio de correo
      ansible.builtin.debug:
        msg: >-
          {{
            'Correo de auditoría enviado exitosamente a ' ~ email_to
            if (envio_correo_result is defined and envio_correo_result is not failed)
            else 'Aviso: No se pudo enviar el correo o envio_correo está desactivado (' ~ (envio_correo_result.msg | default('Sin detalles')) ~ ')'
          }}
      delegate_to: localhost
      run_once: true
